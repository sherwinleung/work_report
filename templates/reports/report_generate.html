{% extends "base.html" %}
{% block content %}
<h3>生成AI工作汇报</h3>
<div class="card"><div class="card-body">
<form method="post" class="row g-3">
  {% csrf_token %}
  <div class="col-md-3">
    <label class="form-label">粒度</label>
    <select class="form-select" name="granularity">
      <option value="daily">日报</option>
      <option value="weekly" selected>周报</option>
      <option value="monthly">月报</option>
      <option value="yearly">年报</option>
      <option value="custom">自定义</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">开始日期</label>
    <input class="form-control" type="date" name="start_date" value="{{ default_start }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">结束日期</label>
    <input class="form-control" type="date" name="end_date" value="{{ default_end }}" required>
  </div>
  <div class="col-12">
    <label class="form-label">偏好（可选）</label>
    <textarea class="form-control" name="prompt_prefs" rows="3" placeholder="例如：突出量化指标、风险及资源需求等"></textarea>
  </div>
  <div class="col-12">
    <button class="btn btn-primary">生成</button>
  </div>
</form>
</div></div>
{% endblock %}
