{% extends "base.html" %}
{% block content %}
<h3>历史汇报</h3>
<a class="btn btn-primary btn-sm mb-3" href="/reports/generate/">新建汇报</a>
<div class="card"><div class="card-body">
<table class="table table-striped table-sm">
  <thead><tr><th>时间</th><th>范围</th><th>粒度</th><th>状态</th><th>查看</th></tr></thead>
  <tbody>
    {% for r in items %}
      <tr>
        <td>{{ r.created_at }}</td>
        <td>{{ r.start_date }} ~ {{ r.end_date }}</td>
        <td>{{ r.granularity }}</td>
        <td>{{ r.status }}</td>
        <td><a class="btn btn-outline-primary btn-sm" href="/reports/{{ r.id }}/">详情</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="5">暂无汇报</td></tr>
    {% endfor %}
  </tbody>
</table>
</div></div>
{% endblock %}
