<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkReport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/arco-lite.css" rel="stylesheet">
      <link href="/static/css/arco-theme.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg arco-nav">
      <div class="container-fluid">
        {% if user.is_authenticated %}
          <!-- 左侧Tab导航 -->
          <div class="nav-tabs-container">
            <div class="nav-tabs-list">
              <a class="nav-tab" href="/dashboard/" data-tab="home">
                <span>首页</span>
              </a>
              <a class="nav-tab" href="/work/" data-tab="worklog">
                <span>工作日报</span>
              </a>
              <a class="nav-tab" href="/reports/" data-tab="reports">
                <span>AI汇报</span>
              </a>
            </div>
          </div>
          
          <!-- 右侧用户信息 -->
          <div class="navbar-user-section ms-auto">
            <span class="navbar-text me-3">{{ user.email }}</span>
            <a class="btn btn-outline-primary btn-sm" href="/accounts/logout/">退出</a>
          </div>
        {% else %}
          <a class="navbar-brand" href="/dashboard/">WorkReport</a>
          <div class="ms-auto">
            <a class="btn btn-primary btn-sm" href="/accounts/login/">登录</a>
          </div>
        {% endif %}
      </div>
    </nav>
    <div class="container my-4">
      {% block content %}{% endblock %}
    </div>
    <script src="/static/arco-lite.js"></script>
  </body>
</html>

{% load static %}
<link href="{% static 'css/arco-theme-light.css' %}?v=20250815b" rel="stylesheet">
