{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <h4 class="mb-3">登录</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">邮箱</label>
          <input class="form-control" type="text" name="username" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">密码</label>
          <input class="form-control" type="password" name="password" required>
        </div>
        <button class="btn btn-primary" type="submit">登录</button>
        <a class="btn btn-link" href="/accounts/register/">去注册</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
