{% extends "base.html" %}
{% block content %}
<h3>用户列表（管理员）</h3>
<div class="card"><div class="card-body">
<table class="table table-striped">
  <thead><tr><th>Email</th><th>姓名</th><th>加入时间</th><th>Staff</th></tr></thead>
  <tbody>
    {% for u in users %}
      <tr><td>{{ u.email }}</td><td>{{ u.first_name }} {{ u.last_name }}</td><td>{{ u.date_joined }}</td><td>{{ u.is_staff }}</td></tr>
    {% endfor %}
  </tbody>
</table>
</div></div>
{% endblock %}
