{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">概览</h3>
<form class="row g-3 mb-3">
  <div class="col-auto">
    <label class="form-label">开始</label>
    <input class="form-control" type="date" name="start" value="{{ start_date }}">
  </div>
  <div class="col-auto">
    <label class="form-label">结束</label>
    <input class="form-control" type="date" name="end" value="{{ end_date }}">
  </div>
  <div class="col-auto align-self-end">
    <button class="btn btn-primary">刷新</button>
  </div>
</form>

<div class="row mb-4 dashboard-stats">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="metric-section">
          <div class="metric">{{ total_hours }}</div>
          <div class="metric-sub">总工作时长（小时）</div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="metric-section">
          <div class="metric">{{ agg.records|default:0 }}</div>
          <div class="metric-sub">记录数</div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center h-100">
          <div>
            <div class="metric">AI</div>
            <div class="metric-sub">汇报生成</div>
          </div>
          <div>
            <a class="btn btn-primary" href="/reports/generate/">
              <i class="fas fa-arrow-right me-1"></i>生成
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 左右布局：按日统计 + 趋势图 -->
<div class="row">
  <!-- 左侧：按日统计 -->
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="mb-3">按日统计（小时）</h5>
        <div class="table-responsive">
          <table class="table table-bordered table-sm">
            <thead><tr><th>日期</th><th>时长(小时)</th><th>记录数</th><th>操作</th></tr></thead>
            <tbody>
              {% for r in by_day %}
                <tr>
                  <td>{{ r.date }}</td>
                  <td>{{ r.total_hours }}</td>
                  <td>{{ r.records }}</td>
                  <td>
                    <a href="/reports/?start_date={{ r.date|date:'Y-m-d' }}&end_date={{ r.date|date:'Y-m-d' }}" class="btn btn-sm btn-outline-primary">查看汇报</a>
                  </td>
                </tr>
              {% empty %}
                <tr><td colspan="4">无数据</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧：趋势图 -->
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">工作趋势</h5>
          <!-- 时间选择器 -->
          <form method="get" class="d-flex gap-2" id="chartDateForm">
            <input type="hidden" name="start" value="{{ start_date }}">
            <input type="hidden" name="end" value="{{ end_date }}">
            <input class="form-control form-control-sm" type="date" name="chart_start" 
                   value="{{ chart_start_date }}" style="width: 140px;">
            <input class="form-control form-control-sm" type="date" name="chart_end" 
                   value="{{ chart_end_date }}" style="width: 140px;">
            <button class="btn btn-primary btn-sm" type="submit">更新</button>
          </form>
        </div>
        <div class="flex-grow-1" style="min-height: 0;">
          <canvas id="trendChart" style="width: 100%; height: 100%;"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 趋势图数据
    const chartData = {{ chart_data|safe }};
    
    const ctx = document.getElementById('trendChart').getContext('2d');
    
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartData.labels,
            datasets: [
                {
                    label: '工作时长（小时）',
                    data: chartData.hours,
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    tension: 0.3,
                    yAxisID: 'y'
                },
                {
                    label: '工作事项数',
                    data: chartData.records,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    tension: 0.3,
                    yAxisID: 'y1'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            scales: {
                x: {
                    display: true,
                    title: {
                        display: true,
                        text: '日期'
                    }
                },
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: {
                        display: true,
                        text: '工作时长（小时）'
                    }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    title: {
                        display: true,
                        text: '工作事项数'
                    },
                    grid: {
                        drawOnChartArea: false,
                    },
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        afterLabel: function(context) {
                            // 点击提示，可以跳转到工作日报
                            return '点击查看当日详情';
                        }
                    }
                }
            },
            onClick: function(event, elements) {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const selectedDate = chartData.dates[index];
                    // 跳转到工作日报页面，并筛选到指定日期
                    window.location.href = `/reports/?start_date=${selectedDate}&end_date=${selectedDate}`;
                }
            }
        }
    });
});
</script>
{% endblock %}
