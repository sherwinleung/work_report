# WorkReport Nginx配置文件
# 将此文件复制到 /etc/nginx/sites-available/workreport
# 然后创建软链接: sudo ln -s /etc/nginx/sites-available/workreport /etc/nginx/sites-enabled/

upstream workreport {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # 替换为你的域名
    
    # 日志文件
    access_log /var/log/nginx/workreport_access.log;
    error_log /var/log/nginx/workreport_error.log;
    
    # 客户端请求大小限制
    client_max_body_size 100M;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 静态文件服务
    location /static/ {
        alias /path/to/your/project/staticfiles/;  # 替换为实际路径
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 媒体文件服务
    location /media/ {
        alias /path/to/your/project/media/;  # 替换为实际路径
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # favicon
    location /favicon.ico {
        alias /path/to/your/project/static/favicon.ico;  # 如果有的话
        access_log off;
        log_not_found off;
    }
    
    # robots.txt
    location /robots.txt {
        alias /path/to/your/project/static/robots.txt;  # 如果有的话
        access_log off;
        log_not_found off;
    }
    
    # 安全设置
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 主应用代理
    location / {
        proxy_pass http://workreport;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 健康检查
    location /health/ {
        proxy_pass http://workreport;
        access_log off;
    }
}

