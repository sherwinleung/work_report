{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>AI汇报</h3>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary btn-sm" href="/reports/api-management/">
      <i class="fas fa-cog me-2"></i>API 管理
    </a>
    <a class="btn btn-primary btn-sm" href="/reports/generate/">
      <i class="fas fa-plus me-2"></i>新建汇报
    </a>
  </div>
</div>
<div class="card"><div class="card-body">
<table class="table table-striped table-sm">
  <thead><tr><th>时间</th><th>范围</th><th>粒度</th><th>状态</th><th>查看</th></tr></thead>
  <tbody>
    {% for r in items %}
      <tr>
        <td>{{ r.created_at }}</td>
        <td>{{ r.start_date }} ~ {{ r.end_date }}</td>
        <td>{{ r.granularity }}</td>
        <td>{{ r.status }}</td>
        <td><a class="btn btn-outline-primary btn-sm" href="/reports/{{ r.id }}/">详情</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="5">暂无汇报</td></tr>
    {% endfor %}
  </tbody>
</table>
</div></div>
{% endblock %}
