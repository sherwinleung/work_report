{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">概览</h3>
<form class="row g-3 mb-3">
  <div class="col-auto">
    <label class="form-label">开始</label>
    <input class="form-control" type="date" name="start" value="{{ start_date }}">
  </div>
  <div class="col-auto">
    <label class="form-label">结束</label>
    <input class="form-control" type="date" name="end" value="{{ end_date }}">
  </div>
  <div class="col-auto align-self-end">
    <button class="btn btn-primary">刷新</button>
  </div>
</form>

<div class="row mb-4 dashboard-stats">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="metric-section">
          <div class="metric">{{ total_hours }}</div>
          <div class="metric-sub">总工作时长（小时）</div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="metric-section">
          <div class="metric">{{ agg.records|default:0 }}</div>
          <div class="metric-sub">记录数</div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center h-100">
          <div>
            <div class="metric">AI</div>
            <div class="metric-sub">汇报生成</div>
          </div>
          <div>
            <a class="btn btn-primary" href="/reports/generate/">
              <i class="fas fa-arrow-right me-1"></i>生成
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div data-arc-tabs class="mb-3">
  <div class="arc-tabs">
    <div class="arc-tab active">按日统计</div>
    <div class="arc-tab">趋势</div>
  </div>

  <div class="arc-tabpane active">
    <div class="card"><div class="card-body">
      <h5 class="mb-3">按日统计（小时）</h5>
      <table class="table table-bordered table-sm">
        <thead><tr><th>日期</th><th>时长(小时)</th><th>记录数</th></tr></thead>
        <tbody>
          {% for r in by_day %}
            <tr><td>{{ r.date }}</td><td>{{ r.total_hours }}</td><td>{{ r.records }}</td></tr>
          {% empty %}
            <tr><td colspan="3">无数据</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div></div>
  </div>

  <div class="arc-tabpane">
    <div class="card"><div class="card-body">
      <h5 class="mb-2">趋势（占位）</h5>
      <p class="text-secondary">这里可接入图表库显示周/月趋势与分布。</p>
    </div></div>
  </div>
</div>
{% endblock %}
